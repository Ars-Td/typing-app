<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>年収打 — ホーム (B)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Trebuchet MS", "Hiragino Sans", sans-serif; background: linear-gradient(180deg, #fff7ed 0%, #fff 40%); color: #1c1917; }
    .ticker { background: #111; color: #facc15; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; letter-spacing: .04em; }
    .ticker .yen { font-size: 22px; color: #4ade80; }
    header { padding: 36px 48px 0; }
    .mock { font-size: 12px; font-weight: 800; color: #ea580c; }
    h1 { font-size: 42px; margin: 8px 0 6px; }
    h1 em { color: #ec4899; font-style: normal; }
    .lead { font-size: 18px; max-width: 640px; }
    .board { display: grid; grid-template-columns: 1.2fr .8fr; gap: 20px; padding: 28px 48px 48px; }
    .panel { background: #fff; border: 4px solid #111; border-radius: 18px; padding: 20px; box-shadow: 8px 8px 0 #f97316; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .lv { display: block; width: 100%; text-align: left; border: 3px solid #111; border-radius: 12px; padding: 12px; margin-bottom: 8px; background: #fff; font-weight: 700; }
    .lv.on { background: #fef08a; box-shadow: 4px 4px 0 #111; }
    .times { display: flex; gap: 8px; }
    .times span { flex: 1; text-align: center; border: 3px solid #111; border-radius: 12px; padding: 10px; font-weight: 800; }
    .times .on { background: #22d3ee; }
    .go { margin-top: 16px; width: 100%; background: #ec4899; color: #fff; border: 4px solid #111; border-radius: 14px; padding: 16px; font-size: 20px; font-weight: 900; box-shadow: 6px 6px 0 #111; }
    .best { font-size: 14px; }
    a { color: #111; font-weight: 800; }
    .screens { position: fixed; right: 16px; bottom: 16px; background: #fff; border: 3px solid #111; border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 700; }
    .screens a { margin-left: 8px; }
  </style>
</head>
<body>
  <div class="ticker">
    <span>SALARY ARCADE</span>
    <span class="yen">自己ベスト ¥12,480,000</span>
    <span>COMBO READY</span>
  </div>
  <header>
    <div class="mock">PATTERN B · Salary Arcade</div>
    <h1>年収<em>打</em></h1>
    <p class="lead">返信を送り切るたび給料が跳ねる。速さも正確さも、全部が今期の年収。</p>
  </header>
  <div class="board">
    <div class="panel">
      <h2>難易度を選べ</h2>
      <button class="lv on">初級 新米エンジニア — 短い。初々しい。</button>
      <button class="lv">中級 慣れてきた — メンション & Markdown</button>
      <button class="lv">上級 つよつよ — 複数行・断言・漢語</button>
      <h2 style="margin-top:16px">制限時間</h2>
      <div class="times"><span>1分</span><span class="on">2分</span><span>3分</span></div>
      <a href="play.html"><button class="go">査定スタート</button></a>
    </div>
    <div class="panel">
      <h2>ルール（超要約）</h2>
      <p>日本語のお手本をローマ字で打つ。送り切ると年収加算。時間切れが終了。</p>
      <p class="best">前回: ¥8,760,000</p>
      <p><a href="stats.html">苦手キーを見る →</a></p>
    </div>
  </div>
  <nav class="screens">B:
    <a href="home.html">ホーム</a>
    <a href="play.html">プレイ</a>
    <a href="result.html">結果</a>
    <a href="stats.html">分析</a>
    <a href="../index.html">比較</a>
  </nav>
</body>
</html>
