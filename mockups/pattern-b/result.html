<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>年収打 — 結果 (B)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Trebuchet MS", "Hiragino Sans", sans-serif; background: #111; color: #fff; }
    .stage { max-width: 880px; margin: 0 auto; padding: 40px 24px; text-align: center; }
    .mock { color: #f97316; font-weight: 800; font-size: 12px; }
    h1 { font-size: 28px; margin: 8px 0; }
    .yen { font-size: 64px; font-weight: 900; color: #4ade80; text-shadow: 4px 4px 0 #ec4899; margin: 12px 0; }
    .sub { color: #a3a3a3; margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: left; }
    .card { background: #fff; color: #111; border: 4px solid #facc15; border-radius: 14px; padding: 14px; }
    .k { font-size: 12px; font-weight: 800; }
    .v { font-size: 26px; font-weight: 900; }
    .cta { margin-top: 28px; display: flex; gap: 12px; justify-content: center; }
    .cta a { text-decoration: none; }
    .btn { display: inline-block; padding: 14px 20px; border: 4px solid #fff; border-radius: 12px; font-weight: 900; color: #111; background: #facc15; }
    .ghost { background: transparent; color: #fff; }
    .screens { position: fixed; right: 16px; bottom: 16px; background: #fff; color: #111; border: 3px solid #facc15; border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 700; }
    .screens a { color: #111; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="mock">PATTERN B · Salary Arcade</div>
    <h1>査定発表！！</h1>
    <div>中級 · 2 分 · 送信 7 件</div>
    <div class="yen">¥8,760,000</div>
    <div class="sub">自己ベスト ¥12,480,000 には届かず…</div>
    <div class="grid">
      <div class="card"><div class="k">速度</div><div class="v">62 WPM</div><div class="k">248 CPM</div></div>
      <div class="card"><div class="k">正確性</div><div class="v">96.4%</div></div>
      <div class="card"><div class="k">ミス</div><div class="v">11</div></div>
      <div class="card"><div class="k">最大コンボ</div><div class="v">48</div></div>
    </div>
    <div class="cta">
      <a href="play.html"><span class="btn">もう一回稼ぐ</span></a>
      <a href="home.html"><span class="btn ghost">ホーム</span></a>
      <a href="stats.html"><span class="btn ghost">分析</span></a>
    </div>
  </div>
  <nav class="screens">B:
    <a href="home.html">ホーム</a>
    <a href="play.html">プレイ</a>
    <a href="result.html">結果</a>
    <a href="stats.html">分析</a>
    <a href="../index.html">比較</a>
  </nav>
</body>
</html>
