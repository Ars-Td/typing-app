<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>年収打 — プレイ (B)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: "Trebuchet MS", "Hiragino Sans", sans-serif; background: #fff; color: #1c1917; }
    .hud { display: grid; grid-template-columns: 1fr 1.4fr 1fr; background: #111; color: #fff; padding: 12px 20px; align-items: center; }
    .timer { font-size: 36px; font-weight: 900; color: #facc15; text-align: center; }
    .pay { text-align: center; }
    .pay .l { font-size: 12px; color: #a3a3a3; }
    .pay .n { font-size: 40px; font-weight: 900; color: #4ade80; line-height: 1; }
    .pop { position: absolute; right: 28%; top: 70px; background: #facc15; color: #111; font-weight: 900; border: 3px solid #111; border-radius: 999px; padding: 6px 14px; transform: rotate(-6deg); }
    .combo { text-align: right; font-weight: 800; color: #f472b6; }
    .wrap { flex: 1; display: flex; min-height: 0; }
    .side { width: 200px; background: #1c1917; color: #fde68a; padding: 12px; }
    .ch { padding: 8px; border-radius: 8px; margin-bottom: 4px; }
    .ch.on { background: #ec4899; color: #fff; font-weight: 800; }
    .feed { flex: 1; padding: 16px 20px; overflow: auto; background: #fff7ed; }
    .bubble { display: flex; gap: 10px; margin-bottom: 14px; }
    .av { width: 40px; height: 40px; border: 3px solid #111; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    .txt { background: #fff; border: 3px solid #111; border-radius: 14px; padding: 10px 12px; box-shadow: 4px 4px 0 #fb923c; }
    .composer { border-top: 4px solid #111; padding: 14px 18px; background: #fff; }
    .jp { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .ok { color: #16a34a; }
    .cur { background: #facc15; }
    .wait { color: #a8a29e; }
    .roma { font-family: ui-monospace, monospace; background: #111; color: #4ade80; padding: 10px 12px; border-radius: 10px; }
    .roma .bad { color: #fb7185; }
    .bar { display: flex; justify-content: space-between; margin-top: 10px; }
    .send { background: #22c55e; border: 3px solid #111; font-weight: 900; padding: 8px 18px; border-radius: 10px; opacity: .4; }
    .screens { position: fixed; right: 16px; bottom: 16px; background: #fff; border: 3px solid #111; border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 700; }
    .screens a { color: #111; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="hud" style="position:relative">
    <div>中級 · #incidents</div>
    <div>
      <div class="timer">01:24</div>
      <div class="pay"><div class="l">ゲーム内年収</div><div class="n">¥3,240,000</div></div>
    </div>
    <div class="combo">COMBO 12</div>
    <div class="pop">+¥240,000 !!</div>
  </div>
  <div class="wrap">
    <aside class="side">
      <div class="ch"># general</div>
      <div class="ch on"># incidents</div>
      <div class="ch"># pr-review</div>
    </aside>
    <div class="feed">
      <div class="bubble">
        <div class="av" style="background:#22d3ee">佐</div>
        <div class="txt"><b>佐藤 PM</b><br>本番落ちてます。PR #123 レビューお願いします！！</div>
      </div>
      <div class="bubble">
        <div class="av" style="background:#c084fc">田</div>
        <div class="txt"><b>田中 SRE</b><br>Issue #88 見て。`5xx` バースト中。</div>
      </div>
    </div>
  </div>
  <div class="composer">
    <div class="jp"><span class="ok">確認します。</span><span class="cur">少</span><span class="wait">々お待ちください。</span></div>
    <div class="roma">kakuninsimasu.<span class="bad">s</span></div>
    <div class="bar">
      <span>ミス 1 · ローマ字入力</span>
      <button class="send">SEND</button>
    </div>
  </div>
  <nav class="screens">B:
    <a href="home.html">ホーム</a>
    <a href="play.html">プレイ</a>
    <a href="result.html">結果</a>
    <a href="stats.html">分析</a>
    <a href="../index.html">比較</a>
  </nav>
</body>
</html>
