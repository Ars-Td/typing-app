<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>返信打 — 分析 (A)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "Hiragino Sans", sans-serif; display: flex; min-height: 100vh; background: #f8fafc; color: #1e293b; }
    .side { width: 220px; background: #3f0e40; color: #fce7f3; padding: 14px 10px; }
    .logo { font-weight: 800; font-size: 18px; padding: 8px 10px 16px; color: #fff; }
    .logo span { color: #84cc16; }
    .ch { padding: 6px 10px; border-radius: 6px; font-size: 13px; }
    .ch.on { background: #5b1d5c; color: #fff; }
    .main { flex: 1; padding: 40px 48px; }
    .mock { font-size: 12px; font-weight: 700; color: #db2777; }
    h1 { margin: 8px 0 6px; }
    .lead { color: #64748b; margin-bottom: 8px; }
    .best { font-size: 13px; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    section { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
    h2 { font-size: 14px; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; color: #94a3b8; font-weight: 600; padding: 4px 0; }
    td { padding: 6px 0; border-top: 1px solid #f1f5f9; }
    .bar { height: 6px; background: #fce7f3; border-radius: 99px; margin-top: 4px; }
    .bar > i { display: block; height: 100%; background: #ec4899; border-radius: 99px; }
    .ref { font-size: 11px; color: #94a3b8; }
    .empty { color: #94a3b8; font-size: 13px; padding: 8px 0; }
    .screens { position: fixed; right: 16px; bottom: 16px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 12px; font-size: 12px; }
    .screens a { color: #7c3aed; margin-left: 8px; }
  </style>
</head>
<body>
  <aside class="side">
    <div class="logo">返信<span>打</span></div>
    <div class="ch"># general</div>
    <div class="ch on"># 分析レポート</div>
  </aside>
  <main class="main">
    <div class="mock">PATTERN A · Workspace Pop</div>
    <h1>タイピング分析</h1>
    <p class="lead">通算の苦手傾向。母数 20 回未満は参考扱い。</p>
    <p class="best">自己ベスト年収 <b>¥12,480,000</b> · 12 プレイ</p>
    <div class="grid">
      <section>
        <h2>苦手キー</h2>
        <table>
          <tr><th>キー</th><th>入力</th><th>ミス</th><th>率</th></tr>
          <tr><td>@</td><td>42</td><td>9</td><td>21%</td></tr>
          <tr><td>#</td><td>38</td><td>7</td><td>18%</td></tr>
          <tr><td>l</td><td>210</td><td>22</td><td>10%</td></tr>
          <tr><td>z <span class="ref">参考</span></td><td>12</td><td>3</td><td>25%</td></tr>
        </table>
      </section>
      <section>
        <h2>苦手な指</h2>
        <div>左小指<div class="bar"><i style="width:72%"></i></div></div>
        <div style="margin-top:10px">右薬指<div class="bar"><i style="width:54%"></i></div></div>
        <div style="margin-top:10px">右人差<div class="bar"><i style="width:31%"></i></div></div>
      </section>
      <section>
        <h2>苦手な動き</h2>
        <table>
          <tr><th>遷移</th><th>出現</th><th>ミス率</th></tr>
          <tr><td>s → h</td><td>80</td><td>14%</td></tr>
          <tr><td>. → @</td><td>28</td><td>18%</td></tr>
          <tr><td>Shift → 3</td><td>38</td><td>16%</td></tr>
        </table>
      </section>
    </div>
    <p class="empty" style="margin-top:20px">データが少ないときは「まだ査定材料が足りません」と空状態を出します。</p>
    <p><a href="home.html" style="color:#7c3aed;font-weight:700">ホームへ</a></p>
  </main>
  <nav class="screens">A:
    <a href="home.html">ホーム</a>
    <a href="play.html">プレイ</a>
    <a href="result.html">結果</a>
    <a href="stats.html">分析</a>
    <a href="../index.html">比較</a>
  </nav>
</body>
</html>
